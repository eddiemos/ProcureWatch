[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurewatch"
version = "0.1.0"
description = "Explainable procurement risk analysis for Kenyan public procurement data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["procurewatch*"]
